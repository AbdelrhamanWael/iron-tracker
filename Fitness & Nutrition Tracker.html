<style>

}

}

}

function getExImg(name) {
  if (!name) return '';
  const clean = name.trim();
  if (IMG_MAP[clean]) return IMG_MAP[clean];
  for (const [k, v] of Object.entries(IMG_MAP)) {

S.w = S.w || {};

const vol = d => { const l = S.l[d]; return l && l.sets ? Object.values(l.sets).reduce((s, a) => s + sv(a), 0) : 0; };
const hasData = d => S.w[d] || vol(d) > 0 || (S.d[d] && ((S.d[d].ck && Object.values(S.d[d].ck).some(Boolean)) || S.d[d].wt > 0));

}

/* 5. TACTICAL REST TIMER ENGINE */
let timerSec = 90, timerCur = 90, timerInterval = null, timerRunning = false;

function fmtTimer(s) {
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m < 10 ? '0' : ''}${m}:${r < 10 ? '0' : ''}${r}`;
}

function updateTimerUI() {
  const disp = $('#t-disp');
  const pIcon = $('#t-icon-play');
  const paIcon = $('#t-icon-pause');
  if (disp) disp.textContent = fmtTimer(timerCur);
  if (pIcon && paIcon) {
    if (timerRunning) {
      pIcon.classList.add('hidden');
      paIcon.classList.remove('hidden');
    } else {
      pIcon.classList.remove('hidden');
      paIcon.classList.add('hidden');
    }
  }
}

function toggleTimer() {
  if (timerRunning) {
    clearInterval(timerInterval);
    timerRunning = false;
  } else {
    if (timerCur <= 0) timerCur = timerSec;
    timerRunning = true;
    timerInterval = setInterval(() => {
      timerCur--;
      updateTimerUI();
      if (timerCur <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        updateTimerUI();
        beepTimer();
      }
    }, 1000);
  }
  updateTimerUI();
}

function setTimerSec(s) {
  timerSec = s;
  timerCur = s;
  clearInterval(timerInterval);
  timerRunning = false;
  toggleTimer();
}

function resetTimer() {
  clearInterval(timerInterval);
  timerRunning = false;
  timerCur = timerSec;
  updateTimerUI();
}

function startRestTimerAuto() {
  timerCur = timerSec;
  clearInterval(timerInterval);
  timerRunning = true;
  timerInterval = setInterval(() => {
    timerCur--;
    updateTimerUI();
    if (timerCur <= 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      updateTimerUI();
      beepTimer();
    }
  }, 1000);
  updateTimerUI();
}

function beepTimer() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
    osc.start();
    osc.stop(ctx.currentTime + 0.8);
  } catch(e) {}
  if (navigator.vibrate) {
    try { navigator.vibrate([200, 100, 200, 100, 300]); } catch(e) {}
  }
}

      </div>
      <div class="flex items-center gap-3 bg-onyx-900 border border-white/10 p-2 rounded-xl">
        <span class="text-xs font-bold font-condensed tracking-wider uppercase ${x.b == 'b' ? 'text-amber-400' : 'text-slate-400'}">Baladi Bread</span>
        <label class="relative inline-flex items-center cursor-pointer min-h-[44px]">
          <input type="checkbox" class="sr-only peer" ${x.b == 'p' ? 'checked' : ''} onchange="setCarb(this.checked)" aria-label="Toggle carbohydrate source">
          <div class="w-11 h-6 bg-onyx-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500"></div>
        </label>
        <span class="text-xs font-bold font-condensed tracking-wider uppercase ${x.b == 'p' ? 'text-amber-400' : 'text-slate-400'}">Boiled Potatoes</span>
      </div>
    </div>

    <!-- Macro Breakdown Cards -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mt-4 pt-4 border-t border-white/[0.08] text-center">
      <div class="p-3 rounded-xl bg-onyx-900 border border-white/[0.06]">
        <div class="text-[11px] text-slate-400 font-condensed uppercase tracking-wider font-bold">CALORIES</div>
        <div class="text-2xl font-mono font-black text-amber-400 mt-0.5">1518</div>
        <div class="text-[10px] text-slate-500 font-mono">kcal</div>
      </div>
      <div class="p-3 rounded-xl bg-onyx-900 border border-white/[0.06]">
        <div class="text-[11px] text-slate-400 font-condensed uppercase tracking-wider font-bold">PROTEIN</div>
        <div class="text-2xl font-mono font-black text-sky-400 mt-0.5">123</div>
        <div class="text-[10px] text-slate-500 font-mono">grams</div>
      </div>
      <div class="p-3 rounded-xl bg-onyx-900 border border-white/[0.06]">
        <div class="text-[11px] text-slate-400 font-condensed uppercase tracking-wider font-bold">CARBS</div>
        <div class="text-2xl font-mono font-black text-amber-300 mt-0.5">~115</div>
        <div class="text-[10px] text-slate-500 font-mono">grams</div>
      </div>
      <div class="p-3 rounded-xl bg-onyx-900 border border-white/[0.06]">
        <div class="text-[11px] text-slate-400 font-condensed uppercase tracking-wider font-bold">FATS</div>
        <div class="text-2xl font-mono font-black text-rose-400 mt-0.5">~35</div>
        <div class="text-[10px] text-slate-500 font-mono">grams</div>
      </div>
    </div>
  </div>

  <!-- Meals Breakdown -->
  ${M.map((m, i) => `
  <div class="athletic-card">
    <div class="flex items-center justify-between mb-2">
      <h3 class="font-condensed font-black text-xl text-white uppercase tracking-wide">${m.t}</h3>
      <span class="text-xs font-mono font-bold bg-onyx-900 px-3 py-1 rounded-lg text-amber-400 border border-amber-500/30">${m.k} kcal • ${m.p}g P</span>
    </div>
    <div class="space-y-1">
      ${m.it.map((t, j) => mealItem(i, j, t)).join('')}
    </div>
  </div>`).join('')}

  <!-- Water & Supplements -->
  <div class="athletic-card">
    <h3 class="font-condensed font-black text-amber-400 text-lg uppercase tracking-wide mb-2">SUPPLEMENTS & HYDRATION</h3>
    <div class="grid sm:grid-cols-2 gap-2">
      ${SUP.map((s, i) => chk(x.sp[i], `setSp(${i},this.checked)`, `<span dir="ltr" class="font-medium">${s}</span>`)).join('')}
    </div>
    <div class="mt-4 pt-3.5 border-t border-white/[0.08]">
      <div class="flex justify-between text-xs text-slate-400 mb-1.5 font-condensed tracking-wider uppercase">
        <span class="font-bold">Water Progress</span>
        <b class="text-sky-400 font-mono text-sm">${x.wt} / 3.5 Liters</b>
      </div>
      ${bar(x.wt / 3.5 * 100, 'bg-sky-500')}
    </div>
  </div>`;
}

/* Tab 3: Analytics & Progress */
function weeks() {
  const ds = dates();
  if (!ds.length) return [];
  const mx = Math.max(4, ...ds.map(wkOf));
  const r = [];
  let pw = null;
  for (let w = 1; w <= mx; w++) {
    const f = ds.filter(d => wkOf(d) === w);
    const ws = f.filter(d => S.w[d]).map(d => +S.w[d]);
    const avg = ws.length ? ws.reduce((a, b) => a + b) / ws.length : null;
    const tv = f.reduce((a, d) => a + vol(d), 0), pv = r.length ? r[r.length - 1].tv : 0;
    r.push({
      w,
      avg,
      ch: avg != null && pw != null ? avg - pw : null,
      dc: f.filter(d => mealDone(d, 0) && mealDone(d, 1)).length,
      kc: f.reduce((a, d) => a + kcal(d), 0),
      wo: f.filter(d => vol(d) > 0).length,
      tv,
      pc: pv > 0 ? (tv - pv) / pv * 100 : null
    });
    if (avg != null) pw = avg;
  }
  return r;
}

function ana() {
  const W = weeks(), names = [...new Set(D.flatMap(d => d.ex.map(e => e.n)))];
  selEx = selEx || names[0];
  const tot = W.reduce((a, w) => a + w.kc, 0), days = W.reduce((a, w) => a + w.dc, 0);
  const cc = c => c == null ? 'text-slate-400' : c <= -0.75 ? 'text-emerald-400 font-bold' : c < 0 ? 'text-amber-400 font-bold' : 'text-red-400 font-bold';

  return `
  <!-- Weekly Summary Table -->
  <div class="athletic-card overflow-x-auto">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-condensed font-black text-xl text-white uppercase tracking-wide">WEEKLY PROGRESSION (Target: −0.75 to −1.0 kg/wk)</h2>
      <span class="text-xs text-slate-400 font-condensed tracking-wider uppercase font-bold">Compliant Days: <b class="text-emerald-400 font-mono text-sm">${days}</b></span>
    </div>
    <table class="w-full text-xs text-center whitespace-nowrap">
      <thead class="text-slate-400 border-b border-white/[0.08] font-condensed uppercase tracking-wider text-sm">
        <tr>
          <th class="p-2.5 text-left">Week</th>
          <th>Avg Weight</th>
          <th>Change</th>
          <th>Diet Compliance</th>
          <th>Calorie Adherence</th>
          <th>Workouts</th>
          <th>Volume (kg)</th>
          <th>vs Previous</th>
        </tr>
      </thead>
      <tbody>
        ${W.length ? W.map(w => `
        <tr class="border-t border-white/[0.06] hover:bg-onyx-700/40 font-mono">
          <td class="p-2.5 text-left font-bold text-slate-200">Week ${w.w}</td>
          <td>${fmt(w.avg)} kg</td>
          <td class="${cc(w.ch)}">${w.ch == null ? '—' : (w.ch > 0 ? '+' : '') + fmt(w.ch, 2) + ' kg'}</td>
          <td>${Math.round(w.dc / 7 * 100)}%</td>
          <td>${Math.round(w.kc / (1518 * 7) * 100)}%</td>
          <td><span class="text-amber-400 font-bold font-mono">${w.wo}</span>/5</td>
          <td>${fmt(w.tv, 0)}</td>
          <td class="${w.pc == null ? '' : w.pc >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${w.pc == null ? '—' : (w.pc > 0 ? '+' : '') + fmt(w.pc) + '%'}</td>
        </tr>`).join('') : '<tr><td colspan="8" class="p-4 text-slate-400 font-sans">No workout or body weight entries yet.</td></tr>'}
      </tbody>
    </table>
  </div>

  <!-- Charts -->
  <div class="athletic-card">
    <h2 class="font-condensed font-black text-xl text-white uppercase tracking-wide mb-2">BODY WEIGHT TRAJECTORY</h2>
    <div class="relative h-64"><canvas id="cW"></canvas></div>
  </div>

  <div class="athletic-card">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
      <h2 class="font-condensed font-black text-xl text-white uppercase tracking-wide">PROGRESSIVE OVERLOAD (VOLUME & MAX KG)</h2>
      <select dir="ltr" class="text-xs font-semibold min-h-[44px]" onchange="selEx=this.value;drawEx()">
        ${names.map(n => `<option ${n == selEx ? 'selected' : ''}>${n}</option>`).join('')}
      </select>
    </div>
    <div class="relative h-72"><canvas id="cE"></canvas></div>
  </div>

  <!-- Backup & Export -->
  <div class="athletic-card">
    <h2 class="font-condensed font-black text-xl text-white uppercase tracking-wide mb-2">BACKUP & DATA RECOVERY</h2>
    <div class="flex flex-wrap gap-2 mb-2">
      <button class="btn-gold text-xs" onclick="expD()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
        <span>Export Data (Copy JSON)</span>
      </button>
      <button class="btn-stealth text-xs" onclick="impD()">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
        <span>Import Data</span>
      </button>
      <input type="file" accept=".json,application/json" class="text-xs cursor-pointer min-h-[44px]" onchange="fileD(this)">
    </div>
    <textarea id="bk" dir="ltr" rows="4" class="w-full text-xs font-mono" placeholder="Paste backup JSON here, then click Import"></textarea>
    <p id="bkm" class="text-xs text-slate-400 mt-1 font-mono"></p>
  </div>`;
}

function expD() {
  const t = $('#bk');
  t.value = JSON.stringify(S);
  t.select();
  let m = 'Data exported. Copied to clipboard!';
  try { navigator.clipboard.writeText(t.value); } catch (e) {}
  $('#bkm').textContent = m;
}

function impD() {
  try {
    const o = JSON.parse($('#bk').value);
    if (!o || typeof o !== 'object' || !o.w || !o.d || !o.l) throw 0;
    S = { w: o.w, d: o.d, l: o.l };
    save();
    render();
    alert('Import successful!');
  } catch (e) {
    $('#bkm').textContent = 'Invalid JSON structure.';
  }
}

function fileD(i) {
  const f = i.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => { $('#bk').value = r.result; impD(); };
  r.readAsText(f);
}

function post() {
  Chart.defaults.color = '#94A3B8';
  Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.08)';
  chW && chW.destroy();
  const wd = Object.keys(S.w).filter(d => S.w[d]).sort();
  if (wd.length) {
    const b = +S.w[wd[0]], dy = d => (new Date(d) - new Date(wd[0])) / 864e5 / 7;
    chW = new Chart($('#cW'), {
      type: 'line',
      data: {
        labels: wd,
        datasets: [
          { label: 'Actual Weight (kg)', data: wd.map(d => +S.w[d]), borderColor: '#F59E0B', backgroundColor: '#F59E0B', tension: 0.25 },
          { label: 'Target −0.75kg/wk', data: wd.map(d => b - .75 * dy(d)), borderColor: '#71717A', borderDash: [6, 4], pointRadius: 0 },
          { label: 'Target −1.0kg/wk', data: wd.map(d => b - dy(d)), borderColor: '#52525B', borderDash: [2, 4], pointRadius: 0 }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }
  drawEx();
}

function drawEx() {
  chE && chE.destroy();
  const n = selEx;
  const pts = Object.keys(S.l).sort().map(d => {
    const a = ((S.l[d].sets || {})[n] || []).filter(Boolean), v = sv(a);
    return v > 0 ? { d, m: Math.max(...a.map(x => +x[0] || 0)), v } : null;
  }).filter(Boolean);

  chE = new Chart($('#cE'), {
    type: 'line',
    data: {
      labels: pts.map(p => `${p.d} (W${wkOf(p.d)})`),
      datasets: [
        { label: 'Max Weight (kg)', data: pts.map(p => p.m), borderColor: '#F59E0B', backgroundColor: '#F59E0B', yAxisID: 'y', tension: 0.25 },
        { label: 'Total Volume (kg)', data: pts.map(p => p.v), borderColor: '#38BDF8', backgroundColor: '#38BDF8', yAxisID: 'y1', tension: 0.25 }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        y: { position: 'left', title: { display: true, text: 'kg' } },
        y1: { position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Volume' } }
      }
    }
  });
}

function render() {
  $('#date').value = cur;
  $('#nav').innerHTML = T.map((t) => `
    <button class="tab-pill ${t.id == tab ? 'on' : ''}" onclick="goTab(${t.id})" role="tab" aria-selected="${t.id == tab}">
      ${t.icon}
      <span>${t.label}</span>
    </button>
  `).join('');
  $('#app').innerHTML = [daily, log, nut, ana][tab]();
  if (tab == 3) post();
  updateTimerUI();
}

render();
</script>
</body>
</html>
